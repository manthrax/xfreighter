<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gamelet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: opacity 1.5s ease-out;
            pointer-events: all;
            text-align: center;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: #88ccff;
            text-shadow: 0 0 20px rgba(136, 204, 255, 0.5);
            letter-spacing: 15px;
        }

        p {
            font-size: 1.2rem;
            color: #88ccff;
            opacity: 0.8;
            margin-bottom: 40px;
        }


        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
        }

        .menu-btn {
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 15px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .menu-btn:hover {
            background: #00ffaa;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.4);
        }

        .menu-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: #444;
            color: #444;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 40px;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid rgba(136, 204, 255, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            width: 500px;
            color: #88ccff;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(136, 204, 255, 0.1);
            padding-bottom: 4px;
        }

        .control-key {
            color: #fff;
            background: rgba(136, 204, 255, 0.1);
            padding: 2px 6px;
            border-radius: 2px;
            border: 1px solid rgba(136, 204, 255, 0.3);
            min-width: 30px;
            text-align: center;
        }

        #ui-layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: auto 1fr auto;
            padding: 10px;
            box-sizing: border-box;
            gap: 10px;
            pointer-events: none;
            z-index: 1001;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        .ui-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
            height: 100%;
            pointer-events: none;
        }

        .ui-column>* {
            pointer-events: auto;
        }

        #col-left {
            grid-column: 1;
        }

        #col-center {
            grid-column: 2;
            align-items: center;
            justify-content: center;
        }

        #col-right {
            grid-column: 3;
            align-items: flex-end;
        }

        .map-detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        #map-sidebar {
            width: 100%;
            background: rgba(0, 20, 30, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(136, 204, 255, 0.1);
            border-right: 2px solid rgba(136, 204, 255, 0.5);
            padding: 20px;
            color: #88ccff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        #map-sidebar.hidden {
            display: none;
        }

        #market-ui {
            width: 540px;
            background: rgba(0, 10, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(136, 204, 255, 0.1);
            border-right: 4px solid rgba(136, 204, 255, 0.6);
            border-radius: 2px;
            padding: 40px;
            display: none;
            flex-direction: column;
            color: #88ccff;
            box-sizing: border-box;
        }

        #market-ui.active {
            display: flex;
        }

        .market-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 170, 0.1);
        }

        .market-btn {
            background: rgba(136, 204, 255, 0.1);
            border: 1px solid rgba(136, 204, 255, 0.4);
            color: #88ccff;
            padding: 6px 18px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        .market-btn:hover {
            background: #88ccff;
            color: #000;
        }

        .market-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <h1>NEBULA DRIFTER</h1>
        <p>DEEP SPACE EXPLORATION INTERFACE / v4.5</p>
        <div class="btn-group">
            <button class="menu-btn" id="resumeBtn">Resume Mission</button>
            <button class="menu-btn" id="startBtn">New Expedition</button>
        </div>

        <div class="controls-grid">
            <div class="control-item"><span>THROTTLE %</span> <span class="control-key">1 - 0</span></div>
            <div class="control-item"><span>HYPERTHRUST</span> <span class="control-key">SPACE</span></div>
            <div class="control-item"><span>PITCH / YAW</span> <span class="control-key">W A S D</span></div>
            <div class="control-item"><span>REVERSE</span> <span class="control-key">-</span></div>
            <div class="control-item"><span>ROLL</span> <span class="control-key">Q / E</span></div>
            <div class="control-item"><span>KILL ENGINES</span> <span class="control-key">`</span></div>
            <div class="control-item"><span>STRAFE</span> <span class="control-key">ARROWS</span></div>
            <div class="control-item"><span>BRAKE</span> <span class="control-key">X</span></div>
            <div class="control-item"><span>DOCK / MARKET</span> <span class="control-key">B</span></div>
            <div class="control-item"><span>STAR MAP</span> <span class="control-key">M</span></div>
            <div class="control-item"><span>AUTOPILOT</span> <span class="control-key">P</span></div>
            <div class="control-item"><span>MOUSE LOOK</span> <span class="control-key">L</span></div>
            <div class="control-item"><span>CYCLE TARGETS</span> <span class="control-key">TAB / SHIFT+TAB</span></div>
        </div>
    </div>

    <div id="ui-layout">
        <div id="top-panel"
            style="grid-column: 1 / span 3; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px;">
        </div>
        <div id="col-left" class="ui-column"></div>
        <div id="col-center" class="ui-column">
            <div id="market-ui">
                <div
                    style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; color: #00ffaa; margin-bottom: 20px; display: flex; justify-content: space-between;">
                    <span>TRADING TERMINAL</span>
                    <span id="market-credits" style="color: #ffcc00;">0 CR</span>
                </div>
                <div style="display: flex; gap: 20px;">
                    <div id="planet-list-container" style="flex-grow: 1;">
                        <div id="market-list"></div>
                    </div>
                    <div id="planet-preview-container"
                        style="width: 200px; height: 200px; background: transparent; border: 1px solid rgba(136,204,255,0.2); position: relative; overflow: hidden; pointer-events: none;">
                        <div
                            style="position: absolute; top: 5px; left: 5px; font-size: 0.6rem; color: #00ffaa; z-index: 10;">
                            PLANETARY LINK: ACTIVE</div>
                    </div>
                </div>
                <button class="menu-btn" id="closeMarket" style="margin-top: 20px; width: 100%;">CLOSE LINK</button>
            </div>
        </div>
        <div id="col-right" class="ui-column">
            <div id="map-sidebar" class="hidden"></div>
        </div>
    </div>
    <script type="module" src="./src/Main.js"></script>
</body>

</html>
